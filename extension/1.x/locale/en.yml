forumcopilot-flapp:
  # The admin page.
  admin:
    page:
      intro: >
        Flapp is an app for Flarum forums, on Android and iPhone. With this extension, your members who use it get
        push notifications from this forum within seconds, in their own language, for the notifications they choose.
      independent: Flapp is an independent app. It is not made by, or affiliated with, the makers of Flarum.
      how_heading: What connecting does
      how_text: >
        Connecting enrols this forum with the Flapp relay, which hands each push to Google and Apple to deliver. The
        forum decides what to send and writes it; the relay never gets anyone's sign-in. Disconnecting, or disabling
        this extension, tells the relay to forget the forum.
      members_heading: What your members see
      members_text: >
        A member who signs in to this forum in Flapp gets a Flapp column in their notification settings, on the forum
        and in the app, and chooses there which notifications reach their phone. The ones that alert on the web by
        default start on. Members who don't use Flapp see no change.
      signin_heading: Signing in to Flapp
      signin_text: >
        Members sign in to Flapp on this forum's own page, in their phone's browser, with the log-in and sign-up
        buttons they use on the website, Google's and other providers' included. A new account comes back to the app
        signed in. This works whether or not the forum is connected, and needs no setting.
      privacy_link: Flapp's privacy policy
      status_heading: Status
      connected_text: "Connected to {relay}."
      not_connected_text: Not connected. Members who use Flapp get no pushes from this forum yet.
      connect_button: Connect
      disconnect_button: Disconnect
      disconnect_confirmation: Disconnect from the Flapp relay? Members' phones stop getting pushes from this forum.

  # Errors from the extension's API calls.
  api:
    already_connected: This forum is already connected. Disconnect it first.
    invalid_app: The app's name is missing or not valid.
    invalid_handle: The handle is missing or not valid.
    invalid_locale: The language is not valid.
    invalid_platform: The platform must be android or ios.
    invalid_sign_in_request: This sign-in request is not valid. Start again from the app.
    not_connected: This forum is not connected to the Flapp relay.
    relay_failed: "The Flapp relay could not connect this forum: {message}"
    token_needed: A device must be registered with the reader's token in the Authorization header.

  forum:
    # /flapp/authorize, where an app signs in through the forum.
    authorize:
      title: "Sign in to {app}"
      guest_heading: "Log in to continue to {app}"
      guest_text: "Log in to {forum}, or sign up, and {app} will be signed in with your account."
      member_heading: "{app} wants to sign in to {forum} as {username}"
      member_text: >
        {app} will be able to do what you can do on this forum. You can sign it out at any time, in the app or
        under Active Sessions on your Security page here.
      authorize_button: Authorize
      cancel_button: Cancel
      not_you_link: "Not {username}? Log out"
      done_text: "You're signed in. You can go back to {app}."
      invalid_text: This sign-in link is not valid. Go back to the app and try again.

    # The reader's notification settings.
    settings:
      notify_by_flapp_heading: Flapp

  # Pushes, for a notification type that has no line of its own.
  push:
    new_notification: New notification
