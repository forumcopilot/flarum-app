forumcopilot-flapp:
  # The admin page.
  admin:
    page:
      intro: "Flapp ist eine App für Flarum-Foren, für Android und iPhone. Mit dieser Erweiterung bekommen deine Mitglieder, die sie nutzen, Push-Benachrichtigungen aus diesem Forum innerhalb von Sekunden, in ihrer eigenen Sprache, für die Benachrichtigungen, die sie auswählen."
      independent: "Flapp ist eine unabhängige App. Sie stammt nicht von den Machern von Flarum und ist nicht mit ihnen verbunden."
      how_heading: "Was das Verbinden bewirkt"
      how_text: "Beim Verbinden meldet sich dieses Forum beim Flapp-Relay an, das jede Push-Benachrichtigung zur Zustellung an Google und Apple weitergibt. Das Forum entscheidet, was gesendet wird, und verfasst es; das Relay erhält nie die Anmeldung von irgendjemandem. Trennen oder das Deaktivieren dieser Erweiterung weist das Relay an, das Forum zu vergessen."
      members_heading: "Was deine Mitglieder sehen"
      members_text: "Wer sich in Flapp bei diesem Forum anmeldet, bekommt in den Benachrichtigungseinstellungen eine Spalte „Flapp“, im Forum und in der App, und wählt dort aus, welche Benachrichtigungen das Telefon erreichen. Was im Web standardmäßig benachrichtigt, ist zu Beginn eingeschaltet. Mitglieder, die Flapp nicht nutzen, merken keine Änderung."
      signin_heading: "Anmeldung in Flapp"
      signin_text: "Mitglieder melden sich in Flapp auf der eigenen Seite dieses Forums an, im Browser ihres Telefons, mit den Knöpfen zum Anmelden und Registrieren, die sie von der Website kennen, auch denen von Google und anderen Anbietern. Ein neues Konto ist in der App gleich angemeldet. Das funktioniert, ob das Forum verbunden ist oder nicht, und braucht keine Einstellung."
      privacy_link: "Datenschutzerklärung von Flapp"
      status_heading: "Status"
      connected_text: "Verbunden mit {relay}."
      not_connected_text: "Nicht verbunden. Mitglieder, die Flapp nutzen, bekommen noch keine Push-Benachrichtigungen aus diesem Forum."
      connect_button: "Verbinden"
      disconnect_button: "Trennen"
      disconnect_confirmation: "Vom Flapp-Relay trennen? Die Telefone der Mitglieder bekommen dann keine Push-Benachrichtigungen mehr aus diesem Forum."

  # Errors from the extension's API calls.
  api:
    already_connected: "Dieses Forum ist bereits verbunden. Trenne es zuerst."
    invalid_app: "Der Name der App fehlt oder ist ungültig."
    invalid_handle: "Das Handle fehlt oder ist ungültig."
    invalid_locale: "Die Sprache ist ungültig."
    invalid_platform: "Die Plattform muss android oder ios sein."
    invalid_sign_in_request: "Diese Anmeldeanfrage ist ungültig. Beginne in der App noch einmal."
    not_connected: "Dieses Forum ist nicht mit dem Flapp-Relay verbunden."
    relay_failed: "Das Flapp-Relay konnte dieses Forum nicht verbinden: {message}"
    token_needed: "Ein Gerät muss mit dem Token des Lesers im Authorization-Header registriert werden."

  forum:
    # /flapp/authorize, where an app signs in through the forum.
    authorize:
      title: "Bei {app} anmelden"
      guest_heading: "Melde dich an, um mit {app} fortzufahren"
      guest_text: "Melde dich bei {forum} an oder registriere dich, dann wird {app} mit deinem Konto angemeldet."
      member_heading: "{app} möchte sich bei {forum} als {username} anmelden"
      member_text: "{app} kann dann alles tun, was du in diesem Forum tun kannst. Du kannst die App jederzeit abmelden, in der App oder hier bei den aktiven Sitzungen auf deiner Sicherheitsseite."
      authorize_button: "Zulassen"
      cancel_button: "Abbrechen"
      not_you_link: "Nicht {username}? Abmelden"
      done_text: "Du bist angemeldet. Du kannst zu {app} zurückkehren."
      invalid_text: "Dieser Anmeldelink ist ungültig. Geh zurück in die App und versuche es noch einmal."

    # The reader's notification settings.
    settings:
      notify_by_flapp_heading: "Flapp"

  # Pushes, for a notification type that has no line of its own.
  push:
    new_notification: "Neue Benachrichtigung"
