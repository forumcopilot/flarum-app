forumcopilot-flapp:
  # The admin page.
  admin:
    page:
      intro: "Flapp — приложение для форумов на Flarum, для Android и iPhone. С этим расширением участники, которые им пользуются, получают push-уведомления с этого форума за секунды, на своём языке, для тех уведомлений, которые они выберут."
      independent: "Flapp — независимое приложение. Его создали не разработчики Flarum, и оно с ними не связано."
      how_heading: "Что даёт подключение"
      how_text: "При подключении форум регистрируется на ретрансляторе Flapp, который передаёт каждое push-уведомление Google и Apple для доставки. Форум сам решает, что отправить, и составляет текст; ретранслятор никогда не получает ничьих данных для входа. Отключение или выключение этого расширения велит ретранслятору забыть форум."
      members_heading: "Что видят участники"
      members_text: "Участник, который входит на этот форум во Flapp, получает столбец Flapp в настройках уведомлений — на форуме и в приложении — и выбирает там, какие уведомления приходят на телефон. Сначала включены те, что по умолчанию приходят в веб-версии. Для участников, которые не пользуются Flapp, ничего не меняется."
      signin_heading: "Вход во Flapp"
      signin_text: "Участники входят во Flapp на собственной странице этого форума, в браузере телефона, с теми же кнопками входа и регистрации, что и на сайте, включая Google и других провайдеров. Новая учётная запись возвращается в приложение уже с выполненным входом. Это работает независимо от того, подключён форум или нет, и не требует настройки."
      privacy_link: "Политика конфиденциальности Flapp"
      status_heading: "Состояние"
      connected_text: "Подключено к {relay}."
      not_connected_text: "Не подключено. Участники, которые пользуются Flapp, пока не получают push-уведомлений с этого форума."
      connect_button: "Подключить"
      disconnect_button: "Отключить"
      disconnect_confirmation: "Отключиться от ретранслятора Flapp? Телефоны участников перестанут получать push-уведомления с этого форума."

  # Errors from the extension's API calls.
  api:
    already_connected: "Этот форум уже подключён. Сначала отключите его."
    invalid_app: "Название приложения не указано или неверно."
    invalid_handle: "Идентификатор не указан или неверен."
    invalid_locale: "Неверный язык."
    invalid_platform: "Платформа должна быть android или ios."
    invalid_sign_in_request: "Этот запрос на вход недействителен. Начните заново в приложении."
    not_connected: "Этот форум не подключён к ретранслятору Flapp."
    relay_failed: "Ретранслятору Flapp не удалось подключить этот форум: {message}"
    token_needed: "Устройство нужно регистрировать с токеном читателя в заголовке Authorization."

  forum:
    # /flapp/authorize, where an app signs in through the forum.
    authorize:
      title: "Вход в {app}"
      guest_heading: "Войдите, чтобы продолжить в {app}"
      guest_text: "Войдите на {forum} или зарегистрируйтесь, и {app} войдёт с вашей учётной записью."
      member_heading: "{app} хочет войти на {forum} как {username}"
      member_text: "{app} сможет делать на этом форуме всё, что можете вы. Выйти из него можно в любое время — в приложении или здесь, в активных сеансах на странице безопасности."
      authorize_button: "Разрешить"
      cancel_button: "Отмена"
      not_you_link: "Не {username}? Выйти"
      done_text: "Вход выполнен. Можно вернуться в {app}."
      invalid_text: "Эта ссылка для входа недействительна. Вернитесь в приложение и попробуйте ещё раз."

    # The reader's notification settings.
    settings:
      notify_by_flapp_heading: "Flapp"

  # Pushes, for a notification type that has no line of its own.
  push:
    new_notification: "Новое уведомление"
