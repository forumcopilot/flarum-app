forumcopilot-flapp:
  # The admin page.
  admin:
    page:
      intro: "Flapp은 Android와 iPhone에서 쓰는 Flarum 포럼용 앱입니다. 이 확장 기능을 사용하면 Flapp을 쓰는 회원은 자신이 고른 알림을 이 포럼에서 몇 초 안에, 자신의 언어로 푸시 알림으로 받습니다."
      independent: "Flapp은 독립적인 앱입니다. Flarum 개발자가 만든 것이 아니며 제휴 관계도 없습니다."
      how_heading: "연결하면 일어나는 일"
      how_text: "연결하면 이 포럼이 Flapp 릴레이에 등록되고, 릴레이는 각 푸시 알림을 Google과 Apple에 넘겨 전달합니다. 무엇을 보낼지는 포럼이 정하고 작성하며, 릴레이는 누구의 로그인 정보도 받지 않습니다. 연결을 해제하거나 이 확장 기능을 비활성화하면 릴레이가 이 포럼을 잊습니다."
      members_heading: "회원에게 보이는 것"
      members_text: "Flapp에서 이 포럼에 로그인한 회원은 포럼과 앱의 알림 설정에 Flapp 열이 생기고, 그곳에서 어떤 알림을 휴대폰으로 받을지 고릅니다. 처음에는 웹에서 기본으로 알리는 항목이 켜져 있습니다. Flapp을 쓰지 않는 회원에게는 달라지는 것이 없습니다."
      privacy_link: "Flapp 개인정보 처리방침"
      status_heading: "상태"
      connected_text: "{relay}에 연결되었습니다."
      not_connected_text: "연결되지 않았습니다. Flapp을 쓰는 회원은 아직 이 포럼의 푸시 알림을 받지 못합니다."
      connect_button: "연결"
      disconnect_button: "연결 해제"
      disconnect_confirmation: "Flapp 릴레이와의 연결을 해제할까요? 회원의 휴대폰에 더 이상 이 포럼의 푸시 알림이 오지 않습니다."

  # Errors from the extension's API calls.
  api:
    already_connected: "이 포럼은 이미 연결되어 있습니다. 먼저 연결을 해제하세요."
    invalid_app: "앱 이름이 없거나 올바르지 않습니다."
    invalid_handle: "핸들이 없거나 올바르지 않습니다."
    invalid_locale: "언어가 올바르지 않습니다."
    invalid_platform: "플랫폼은 android 또는 ios여야 합니다."
    not_connected: "이 포럼은 Flapp 릴레이에 연결되어 있지 않습니다."
    relay_failed: "Flapp 릴레이가 이 포럼을 연결하지 못했습니다: {message}"
    token_needed: "기기는 Authorization 헤더에 읽는 사람의 토큰을 넣어 등록해야 합니다."

  # The reader's notification settings.
  forum:
    settings:
      notify_by_flapp_heading: "Flapp"

  # Pushes, for a notification type that has no line of its own.
  push:
    new_notification: "새 알림"
