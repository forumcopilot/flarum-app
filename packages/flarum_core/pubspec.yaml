name: flarum_core
description: Flarum REST (JSON:API) client for flarum-app, supporting Flarum 1.8 and 2.0.
version: 0.1.0
publish_to: none

# Plain Dart for now (Phase 0). It becomes a Flutter package in Phase 2, when it
# implements the forumcopilot_sdk proxies.
environment:
  sdk: ^3.6.0

dependencies:
  # Same HTTP client as forumcopilot_sdk.
  dio: ^5.4.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
