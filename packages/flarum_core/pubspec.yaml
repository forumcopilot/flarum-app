name: flarum_core
description: Flarum REST (JSON:API) client for flarum-app and its forumcopilot_sdk proxies, supporting Flarum 1.8 and 2.0.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # Same HTTP client as forumcopilot_sdk.
  dio: ^5.4.0
  # Keychain / Keystore for each forum's sign-in token, as discourse_core keeps its key.
  flutter_secure_storage: ^9.2.4
  # The SDK lives in discourse-app, pinned by commit as ABDA pins discourse-app.
  # For local development, copy pubspec_overrides.yaml.example to pubspec_overrides.yaml.
  forumcopilot_sdk:
    git:
      url: https://github.com/forumcopilot/discourse-app.git
      path: packages/forumcopilot_sdk
      ref: 3febf29cd97c62db3ebe33dfd20f02d431904f04

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
