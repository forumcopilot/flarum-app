name: flarum_ui
description: Flarum screens for flarum-app, on forum_kit and flarum_core, for Flarum 1.8 and 2.0.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flarum_core:
    path: ../flarum_core
  # forum_kit and the SDK live in discourse-app, pinned by commit as ABDA pins discourse-app.
  # For local development, copy pubspec_overrides.yaml.example to pubspec_overrides.yaml.
  forum_kit:
    git:
      url: https://github.com/forumcopilot/discourse-app.git
      path: packages/forum_kit
      ref: 8c56b48e19787b126b97c37f1ab0cdb3cdde45b4
  forumcopilot_sdk:
    git:
      url: https://github.com/forumcopilot/discourse-app.git
      path: packages/forumcopilot_sdk
      ref: 8c56b48e19787b126b97c37f1ab0cdb3cdde45b4
  # The post renderer, as discourse_ui has it.
  dio: ^5.4.0
  flutter_html: ^3.0.0-beta.2
  flutter_layout_grid: ^2.0.8 # post tables: CSS-grid track sizing, with col/rowspan
  html: '>=0.15.6 <0.15.7' # 0.15.7 drops Element.matches, which flutter_html 3.0.0 still calls
  intl: ^0.20.2
  share_plus: ^12.0.1
  url_launcher: ^6.2.5
  video_player: ^2.10.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
