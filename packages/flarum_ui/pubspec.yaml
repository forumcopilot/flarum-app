name: flarum_ui
description: Flarum screens for flarum-app, on forum_kit and flarum_core, for Flarum 1.8 and 2.0.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flarum_core:
    path: ../flarum_core
  # forum_kit and the SDK live in discourse-app, pinned by commit as ABDA pins discourse-app.
  # For local development, copy pubspec_overrides.yaml.example to pubspec_overrides.yaml.
  forum_kit:
    git:
      url: https://github.com/forumcopilot/discourse-app.git
      path: packages/forum_kit
      ref: ac722f5da4eff1c0025354a5951712452feef05e
  forumcopilot_sdk:
    git:
      url: https://github.com/forumcopilot/discourse-app.git
      path: packages/forumcopilot_sdk
      ref: ac722f5da4eff1c0025354a5951712452feef05e
  # The post renderer, as discourse_ui has it.
  device_info_plus: ^11.2.0 # the picture viewer: Android before 10 asks for storage to save
  dio: ^5.4.0
  flutter_html: ^3.0.0-beta.2
  flutter_layout_grid: ^2.0.8 # post tables: CSS-grid track sizing, with col/rowspan
  flutter_svg: ^2.0.10 # the GitHub mark in GitHub link pills; the version forum_kit uses
  html: '>=0.15.6 <0.15.7' # 0.15.7 drops Element.matches, which flutter_html 3.0.0 still calls
  flutter_inappwebview: ^6.1.5 # sign-in: the forum's page, and its HttpOnly remember cookie
  image_picker: ^1.2.1 # the composer's uploads: XFile, as forum_kit's pickers give them
  intl: ^0.20.2
  permission_handler: ^12.0.0+1 # the picture viewer: storage, to save on Android before 10
  saver_gallery: ^4.1.0 # the picture viewer's Save Image, into the phone's photos
  scrollable_positioned_list: ^0.3.8 # a thread opens scrolled to a post
  share_plus: ^12.0.1
  shared_preferences: ^2.5.1 # the reader's appearance choice
  url_launcher: ^6.2.5
  video_player: ^2.10.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/signin.js
